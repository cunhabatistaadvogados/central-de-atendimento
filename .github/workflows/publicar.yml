name: Publicar Central CB&

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # O BANCO VEM PRIMEIRO (licao do sistema do Dr. Marcello, 17/09/2026): uma
  # migration quebrada deixou dias de alteracao parada enquanto o codigo novo
  # subia pedindo colunas que nao existiam. Aqui: migration falhou, nada vai ao ar.
  # Sem os segredos SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD o passo avisa e
  # segue; as migrations entao sao aplicadas a mao pelo painel.
  banco:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: wizoolakyttjrahpbgec
    outputs:
      token: ${{ steps.token.outputs.presente }}
    steps:
      - uses: actions/checkout@v6
      - name: Conferir segredos do Supabase
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "presente=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN ou SUPABASE_DB_PASSWORD ausente: banco e Edge Functions nao foram publicados automaticamente."
          else
            echo "presente=true" >> "$GITHUB_OUTPUT"
          fi
      # Versao fixa da CLI: "latest" pergunta ao GitHub sem credencial e ja
      # derrubou publicacao por limite de visitante no sistema do Marcello.
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.presente == 'true'
        with:
          version: 2.117.0
      - name: Aplicar migrations
        if: steps.token.outputs.presente == 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"

  build:
    runs-on: ubuntu-latest
    env:
      # A chave publishable faz parte do site publico. Nunca use service_role aqui.
      VITE_SUPABASE_URL: https://wizoolakyttjrahpbgec.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_GhZ_n4piV-fC4OiqxojDdg_-CoUenok
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Testar o robo e o contrato
        run: npm test
      - name: Gerar a versao de producao
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, banco]
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Funcoes sobem junto com o codigo: senao a que roda em producao fica mais
  # velha que a do repositorio (aconteceu no Marcello).
  funcoes:
    runs-on: ubuntu-latest
    needs: banco
    if: needs.banco.outputs.token == 'true'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: wizoolakyttjrahpbgec
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Publicar as Edge Functions
        run: |
          supabase functions deploy meta-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy whatsapp-send --project-ref "$PROJECT_REF"
